# Dependency updates, opened as pull requests once a week. Every pull request runs lint, the unit tests and the
# full e2e suite (.github/workflows/firebase-deploy.yml), so an update that breaks the site says so before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor releases arrive together as one pull request rather than a dozen.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions of these are migrations (React 19, Tailwind 4, Motion 14), not updates: each changes how
      # the site is written and needs doing on purpose. Security fixes are still raised whatever the version.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: motion
        update-types: [version-update:semver-major]

  # The actions the workflow uses (checkout, setup-node, cache, the Firebase deploy).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
