name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pushing twice in quick succession raced two deploys to the live channel, and whichever
# finished last won regardless of which commit it built. Newer push wins, older is cancelled.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      # (v5+ run on Node 24 — v4 used Node 20, which GitHub removes from runners on 2026-09-23)
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Lint and test before anything reaches the live channel. This job deploys straight to
      #    production, so a failure here has to stop it — the e2e suite builds and previews the
      #    site itself (see playwright.config.js), which is also what catches case-sensitivity
      #    breakage that a Windows checkout can't reproduce locally.
      - name: Lint
        run: npm run lint

      # The browser is ~130MB and re-downloading it cost ~25s of every deploy. Cache it against the
      # Playwright version, so it is only fetched again when that version actually changes. The OS
      # libraries it needs aren't part of the cache, so those are still installed on a hit.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # 5. Build the Vite project
      - name: Build
        run: npm run build

      # 6. Deploy to Firebase Hosting
      # (the moving v0 tag points at v0.11.0+, which already runs on Node 24)
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: bicrec
