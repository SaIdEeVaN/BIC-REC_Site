name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main   # change to "master" if your branch is named that
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      # (v5+ run on Node 24 — v4 used Node 20, which GitHub removes from runners on 2026-09-23)
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the Vite project
      - name: Build
        run: npm run build

      # 5. Deploy to Firebase Hosting
      # (the moving v0 tag points at v0.11.0+, which already runs on Node 24)
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: bicrec
