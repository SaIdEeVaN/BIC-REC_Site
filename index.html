<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Everything between seo:start/seo:end is rewritten per route by scripts/prerender-meta.js (see src/seo.js). -->
    <!-- seo:start -->
    <title>Blockchain Innovation Club | REC</title>
    <meta name="description" content="A student-driven community dedicated to exploring Blockchain, Web3, and emerging technologies at Rajalakshmi Engineering College." />
    <link rel="canonical" href="https://bicrec.web.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BIC/REC" />
    <meta property="og:title" content="Blockchain Innovation Club | REC" />
    <meta property="og:description" content="A student-driven community dedicated to exploring Blockchain, Web3, and emerging technologies at Rajalakshmi Engineering College." />
    <meta property="og:url" content="https://bicrec.web.app/" />
    <meta property="og:image" content="https://bicrec.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BIC/REC — Blockchain Innovation Club, Rajalakshmi Engineering College" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blockchain Innovation Club | REC" />
    <meta name="twitter:description" content="A student-driven community dedicated to exploring Blockchain, Web3, and emerging technologies at Rajalakshmi Engineering College." />
    <meta name="twitter:image" content="https://bicrec.web.app/og-image.png" />
    <!-- seo:end -->
    <meta name="theme-color" content="#EDE6D8" />
    <script>
      // Applies a saved dark theme before the first paint, so the light page never flashes first (src/lib/theme.js).
      try {
        if (localStorage.getItem('bic-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#14110E'
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
