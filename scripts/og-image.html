<!doctype html>
<!-- Source for public/og-image.png (1200x630 share image). Regenerate with: npm run og-image -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BIC/REC share image</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=IBM+Plex+Mono:wght@500&display=block"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: #ede6d8;
        color: #14110e;
        font-family: Archivo, Arial, sans-serif;
      }
      .mono { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
      .ticker {
        background: #14110e;
        color: #ede6d8;
        font-size: 15px;
        line-height: 1;
        padding: 13px 56px;
        white-space: nowrap;
        overflow: hidden;
      }
      .ticker span { margin-right: 40px; }
      .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 56px; }
      .meta { font-size: 18px; color: #4a4238; }
      .mark {
        margin-top: 22px;
        font-size: 230px;
        font-weight: 900;
        line-height: 0.8;
        letter-spacing: -0.055em;
      }
      .tag {
        margin-top: 30px;
        font-size: 46px;
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }
      .foot { display: grid; grid-template-columns: 1fr auto; border-top: 3px solid #14110e; }
      .rail { padding: 0 44px 0 56px; }
      .url {
        display: flex;
        align-items: center;
        padding: 0 44px;
        border-left: 3px solid #14110e;
        background: #d9a441;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <div class="ticker mono">
      <span>block #0001 · 0xb51…e50 · sealed 15.01.26</span>
      <span>block #0002 · 0x5a5…93b · sealed 20.02.26</span>
      <span>block #0003 · 0x51c…945 · sealed 10.03.26</span>
      <span>block #0004 · 0x2b8…2a3 · pending</span>
    </div>

    <div class="main">
      <p class="meta mono">blockchain innovation club · rajalakshmi engineering college</p>
      <p class="mark">BIC/REC</p>
      <p class="tag">Build. Innovate. Decentralize.</p>
    </div>

    <div class="foot">
      <div class="rail">
        <svg width="100%" height="96" overflow="visible">
          <line x1="0" y1="48" x2="100%" y2="48" stroke="#14110E" stroke-width="3" />
          <svg x="8.333%" overflow="visible"><line x1="-8" y1="40" x2="-21" y2="27" stroke="#14110E" stroke-width="3" stroke-linecap="square" /><line x1="-8" y1="56" x2="-21" y2="69" stroke="#14110E" stroke-width="3" stroke-linecap="square" /><rect x="-8" y="40" width="16" height="16" fill="#EDE6D8" stroke="#14110E" stroke-width="3" /></svg>
          <svg x="25%" overflow="visible"><line x1="-8" y1="40" x2="-21" y2="27" stroke="#14110E" stroke-width="3" stroke-linecap="square" /><line x1="-8" y1="56" x2="-21" y2="69" stroke="#14110E" stroke-width="3" stroke-linecap="square" /><rect x="-8" y="40" width="16" height="16" fill="#EDE6D8" stroke="#14110E" stroke-width="3" /></svg>
          <svg x="41.667%" overflow="visible"><line x1="-8" y1="40" x2="-21" y2="27" stroke="#14110E" stroke-width="3" stroke-linecap="square" /><line x1="-8" y1="56" x2="-21" y2="69" stroke="#14110E" stroke-width="3" stroke-linecap="square" /><rect x="-8" y="40" width="16" height="16" fill="#EDE6D8" stroke="#14110E" stroke-width="3" /></svg>
          <svg x="58.333%" overflow="visible"><line x1="-8" y1="40" x2="-21" y2="27" stroke="#14110E" stroke-width="3" stroke-linecap="square" /><line x1="-8" y1="56" x2="-21" y2="69" stroke="#14110E" stroke-width="3" stroke-linecap="square" /><rect x="-8" y="40" width="16" height="16" fill="#EDE6D8" stroke="#14110E" stroke-width="3" /></svg>
          <svg x="75%" overflow="visible"><line x1="-8" y1="40" x2="-21" y2="27" stroke="#14110E" stroke-width="3" stroke-linecap="square" /><line x1="-8" y1="56" x2="-21" y2="69" stroke="#14110E" stroke-width="3" stroke-linecap="square" /><rect x="-8" y="40" width="16" height="16" fill="#EDE6D8" stroke="#14110E" stroke-width="3" /></svg>
          <svg x="91.667%" overflow="visible"><line x1="-8" y1="40" x2="-21" y2="27" stroke="#14110E" stroke-width="3" stroke-linecap="square" /><line x1="-8" y1="56" x2="-21" y2="69" stroke="#14110E" stroke-width="3" stroke-linecap="square" /><rect x="-8" y="40" width="16" height="16" fill="#D9A441" stroke="#14110E" stroke-width="3" /></svg>
